[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myna-ai"
version = "0.1.0"
description = "Training, evaluation, compression and offline inference infrastructure for the Myna architecture and engineering assistant."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Myna AI"}]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0.1",
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dataset = [
    "pyarrow>=16.1,<17",
    "huggingface_hub>=0.26",
]
train = [
    "torch>=2.4",
    "transformers>=4.57.1,<6",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "datasets>=3.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.26",
    "pyarrow>=16.1,<17",
]
# bitsandbytes is CUDA-only and is imported only when QLoRA is requested.
quant = [
    "bitsandbytes>=0.44",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
myna-inspect-dataset = "myna_ai.cli:inspect_dataset"
myna-prepare-dataset = "myna_ai.cli:prepare_dataset"
myna-train = "myna_ai.cli:train"
myna-evaluate = "myna_ai.cli:evaluate"
myna-export = "myna_ai.cli:export"
myna-benchmark = "myna_ai.cli:benchmark"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myna_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "train: tests that import torch, transformers and peft",
    "network: tests that call external services",
]
addopts = "-q"

[tool.coverage.run]
source = ["myna_ai"]
