# CPU smoke configuration. This does not train OLMo 3.
model_key: smoke-tiny
train_path: data/processed/synthetic/train.jsonl
validation_path: data/processed/synthetic/validation.jsonl
output_dir: outputs/smoke-tiny
method: lora
max_seq_length: 256
lora_r: 4
lora_alpha: 8
lora_dropout: 0.0
learning_rate: 0.01
weight_decay: 0.0
per_device_batch_size: 1
gradient_accumulation_steps: 1
epochs: 1
max_steps: 12
precision: fp32
gradient_checkpointing: false
seed: 42
logging_steps: 1
eval_steps: 6
save_steps: 6
early_stopping_patience: 0
warmup_steps: 0
allow_cpu_smoke: true
backend: native
local_files_only: true
smoke_n_embd: 64
smoke_n_layer: 2
smoke_n_head: 4
